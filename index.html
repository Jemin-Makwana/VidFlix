<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch on Vidflix</title>
    <meta name="theme-color" content="#E50914">
    <meta property="og:title" content="Watch on Vidflix" id="ogTitle">
    <meta property="og:description" content="Stream movies and web series in HD for free on Vidflix App.">
    <meta property="og:type" content="video.movie">
    <style>
        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        html { background: #08080a; }

        body {
            position: relative;
            overflow-x: hidden;
            background: #08080a;
            color: #f4f4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px 20px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Cinematic background ---------- */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg span {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
        }
        .bg span:nth-child(1) {
            width: 55vmax; height: 55vmax;
            left: -20vmax; top: -22vmax;
            background: radial-gradient(circle, #e50914 0%, transparent 65%);
            animation: drift1 18s ease-in-out infinite alternate;
        }
        .bg span:nth-child(2) {
            width: 50vmax; height: 50vmax;
            right: -22vmax; bottom: -24vmax;
            background: radial-gradient(circle, #7a0a3a 0%, transparent 65%);
            animation: drift2 22s ease-in-out infinite alternate;
        }
        .bg::before,
        .bg::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            width: 22px;
            opacity: 0.35;
            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0 14px,
                    rgba(255,255,255,0.16) 14px 30px,
                    transparent 30px 44px
                ) center / 10px 100% no-repeat;
            border-left: 1px solid rgba(255,255,255,0.06);
            border-right: 1px solid rgba(255,255,255,0.06);
            animation: film 3.2s linear infinite;
            background-position: center 0;
        }
        .bg::before { left: 14px; }
        .bg::after  { right: 14px; }
        @keyframes film {
            from { background-position: center 0; }
            to   { background-position: center 44px; }
        }
        @keyframes drift1 {
            to { transform: translate(8vmax, 6vmax) scale(1.1); }
        }
        @keyframes drift2 {
            to { transform: translate(-7vmax, -5vmax) scale(1.12); }
        }

        /* ---------- Card ---------- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 400px;
            width: 100%;
            padding: 40px 28px 28px;
            border-radius: 22px;
            background: rgba(20, 20, 24, 0.72);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid transparent;
            background-clip: padding-box;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 90px rgba(229, 9, 20, 0.12);
            animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both;
        }
        /* animated gradient border */
        .container::before {
            content: "";
            position: absolute;
            inset: -1px;
            z-index: -1;
            border-radius: inherit;
            padding: 1px;
            background: conic-gradient(
                from var(--angle),
                rgba(229, 9, 20, 0.0),
                rgba(229, 9, 20, 0.95),
                rgba(255, 120, 90, 0.7),
                rgba(229, 9, 20, 0.0) 55%,
                rgba(255, 255, 255, 0.12) 80%,
                rgba(229, 9, 20, 0.0)
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            animation: spinBorder 6s linear infinite;
        }
        @keyframes spinBorder { to { --angle: 360deg; } }
        @keyframes rise {
            from { opacity: 0; transform: translateY(26px) scale(0.97); }
            to   { opacity: 1; transform: none; }
        }

        /* ---------- Emblem + logo ---------- */
        .emblem {
            position: relative;
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff2a36, #b5060f);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.5), inset 0 1px 0 rgba(255,255,255,0.35);
        }
        .emblem::before {
            content: "";
            position: absolute;
            left: 50%; top: 50%;
            width: 0; height: 0;
            transform: translate(-36%, -50%);
            border-left: 20px solid #fff;
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .emblem::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(229, 9, 20, 0.7);
            animation: pulse 2.4s ease-out infinite;
        }
        @keyframes pulse {
            0%   { transform: scale(1);   opacity: 0.9; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 0.22em;
            margin-bottom: 26px;
            padding-left: 0.22em; /* balances trailing letter-spacing */
            text-transform: uppercase;
            background: linear-gradient(180deg, #ff4a54 0%, #e50914 55%, #a60610 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #E50914;
        }

        /* ---------- Loader (slim progress bar) ---------- */
        .spinner {
            position: relative;
            width: 120px;
            height: 3px;
            margin: 0 auto 24px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        .spinner::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            width: 45%;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, #E50914, #ff6b73);
            animation: load 1.2s ease-in-out infinite;
        }
        @keyframes load {
            from { left: -45%; }
            to   { left: 100%; }
        }

        /* ---------- Text ---------- */
        .movie-title {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.01em;
            color: #ffffff;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .subtitle {
            font-size: 14px;
            color: #a1a1aa;
            margin: 0 auto 28px;
            max-width: 32ch;
            line-height: 1.55;
        }

        /* ---------- Buttons ---------- */
        .btn {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
            padding: 15px 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
            margin-bottom: 12px;
        }
        .btn:active { transform: scale(0.98); }
        .btn:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }
        .btn-primary {
            background: linear-gradient(180deg, #f2121d 0%, #c40711 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 28px rgba(229, 9, 20, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .btn-primary::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            left: -60%;
            width: 40%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: skewX(-20deg);
            animation: shine 4.5s ease-in-out 1.2s infinite;
        }
        @keyframes shine {
            0%, 70% { left: -60%; }
            100%    { left: 130%; }
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(229, 9, 20, 0.6), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f4f4f5;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.28);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
            letter-spacing: 0.04em;
            color: #71717a;
        }

        @media (max-width: 480px) {
            .bg::before { left: 6px; }
            .bg::after  { right: 6px; }
            .container  { padding: 34px 22px 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition: none !important;
            }
            .spinner::after { animation: none; left: 0; width: 100%; opacity: 0.6; }
        }
    </style>
</head>
<body>

<div class="bg" aria-hidden="true"><span></span><span></span></div>

<div class="container">
    <div class="emblem" aria-hidden="true"></div>
    <div class="logo">VIDFLIX</div>
    
    <div class="spinner" id="loader"></div>
    
    <div class="movie-title" id="displayTitle">Opening in Vidflix...</div>
    <div class="subtitle" id="displaySubtitle">Wait a moment while we redirect you to the app.</div>

    <a href="#" class="btn btn-primary" id="openAppBtn">▶ Open in Vidflix App</a>
    <a href="https://github.com/VidFlixApp/VidFlix/releases/download/v1.0.0/VidFlix.apk" class="btn btn-secondary" id="downloadAppBtn">⬇ Download Vidflix App (APK)</a>

    <div class="footer">Vidflix Streaming • Fast & Free</div>
</div>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTo = urlParams.get('redirectto');
        const title = urlParams.get('title');

        if (title) {
            const decodedTitle = decodeURIComponent(title);
            document.title = decodedTitle + " - Vidflix";
            document.getElementById('displayTitle').innerText = decodedTitle;
            document.getElementById('displaySubtitle').innerText = "Click below to watch directly inside Vidflix.";
            const ogTitle = document.getElementById('ogTitle');
            if (ogTitle) ogTitle.setAttribute('content', decodedTitle + " on Vidflix");
        }

        if (redirectTo) {
            const appUrl = decodeURIComponent(redirectTo);
            const openAppBtn = document.getElementById('openAppBtn');
            openAppBtn.href = appUrl;

            // Automatically open app
            window.location.href = appUrl;

            // Hide spinner after 2.5s if app is not installed
            setTimeout(function() {
                const loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';
            }, 2500);
        } else {
            document.getElementById('displayTitle').innerText = "Vidflix Stream";
            document.getElementById('displaySubtitle').innerText = "Watch movies and series in HD.";
            document.getElementById('openAppBtn').style.display = 'none';
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
        }
    })();
</script>

</body>
</html>
