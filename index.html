<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch on Vidflix</title>
    <meta name="theme-color" content="#E50914">
    <meta property="og:title" content="Watch on Vidflix" id="ogTitle">
    <meta property="og:description" content="Stream movies and web series in HD for free on Vidflix App.">
    <meta property="og:type" content="video.movie">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #1f1f1f;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a2a2a;
        }
        .logo {
            font-size: 32px;
            font-weight: 900;
            color: #E50914;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .movie-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .subtitle {
            font-size: 14px;
            color: #a3a3a3;
            margin-bottom: 28px;
            line-height: 1.4;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(229, 9, 20, 0.2);
            border-top: 4px solid #E50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        .btn-primary {
            background-color: #E50914;
            color: #ffffff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #f40612;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: #2b2b2b;
            color: #e5e5e5;
            border: 1px solid #3d3d3d;
        }
        .btn-secondary:hover {
            background-color: #383838;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">VIDFLIX</div>
    
    <div class="spinner" id="loader"></div>
    
    <div class="movie-title" id="displayTitle">Opening in Vidflix...</div>
    <div class="subtitle" id="displaySubtitle">Wait a moment while we redirect you to the app.</div>

    <a href="#" class="btn btn-primary" id="openAppBtn">▶ Open in Vidflix App</a>
    <a href="https://github.com/Jemin-Makwana/VidFlix/releases" class="btn btn-secondary" id="downloadAppBtn">⬇ Download Vidflix App (APK)</a>

    <div class="footer">Vidflix Streaming • Fast & Free</div>
</div>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectTo = urlParams.get('redirectto');
        const title = urlParams.get('title');

        if (title) {
            const decodedTitle = decodeURIComponent(title);
            document.title = decodedTitle + " - Vidflix";
            document.getElementById('displayTitle').innerText = decodedTitle;
            document.getElementById('displaySubtitle').innerText = "Click below to watch directly inside Vidflix.";
            const ogTitle = document.getElementById('ogTitle');
            if (ogTitle) ogTitle.setAttribute('content', decodedTitle + " on Vidflix");
        }

        if (redirectTo) {
            const appUrl = decodeURIComponent(redirectTo);
            const openAppBtn = document.getElementById('openAppBtn');
            openAppBtn.href = appUrl;

            // Automatically open app
            window.location.href = appUrl;

            // Hide spinner after 2.5s if app is not installed
            setTimeout(function() {
                const loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';
            }, 2500);
        } else {
            document.getElementById('displayTitle').innerText = "Vidflix Stream";
            document.getElementById('displaySubtitle').innerText = "Watch movies and series in HD.";
            document.getElementById('openAppBtn').style.display = 'none';
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';
        }
    })();
</script>

</body>
</html>
